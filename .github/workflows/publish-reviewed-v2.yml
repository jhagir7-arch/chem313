
name: Import reviewed desktop beta
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify and import reviewed runtime notice patch
        shell: python
        run: |
          import hashlib, json, pathlib, stat, subprocess, zipfile
          root = pathlib.Path.cwd()
          archive = 'chem313-runtime-notice-fix.zip'
          workflow = '.github/workflows/publish-reviewed-v2.yml'
          base = '3673f628e7eeb5e2231d6465c35a86e6513d1c64'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed <= {archive,workflow}, 'Concurrent repository edits require review'
          digest=lambda data: hashlib.sha256(data).hexdigest()
          assert digest((root/archive).read_bytes()) == 'dd9573fbb4b48103a53add80b9a7771ee033cec43b68725e371c35089a31df17'
          prefix='chem313-runtime-fix/'
          with zipfile.ZipFile(root/archive) as z:
              names=z.namelist()
              assert len(names)==len(set(names)) and len(names)==17
              assert sum(i.file_size for i in z.infolist())<1000000
              for i in z.infolist():
                  assert i.filename.startswith(prefix)
                  p=pathlib.PurePosixPath(i.filename[len(prefix):])
                  assert p.parts and not p.is_absolute() and '..' not in p.parts
                  assert '.git' not in p.parts and not stat.S_ISLNK(i.external_attr>>16)
                  assert chr(92) not in str(p)
              assert z.testzip() is None
              manifest=json.loads(z.read(prefix+'PATCH_MANIFEST.json'))
              assert manifest['base']==base
              expected={prefix+f['path'] for f in manifest['files']}
              assert set(names)==expected|{prefix+'PATCH_MANIFEST.json'}
              for f in manifest['files']:
                  path=f['path']
                  assert path in {'.gitattributes','BUNDLE_MANIFEST.json','scripts/collect_standalone_licenses.py','scripts/freeze_engine.py','scripts/tests/test_freeze_engine_runtime.py','scripts/tests/test_macos_runtime_replay.py'} or path.startswith(('desktop/licenses/portable-runtime/','desktop/licenses/rust-v2/webview2-com'))
                  payload=z.read(prefix+path)
                  assert len(payload)==f['bytes'] and digest(payload)==f['sha256']
                  old=subprocess.run(['git','show',base+':'+path],capture_output=True)
                  assert (digest(old.stdout) if old.returncode==0 else None)==f['old_sha256']
              for f in manifest['files']:
                  destination=root/f['path']
                  assert destination.resolve().is_relative_to(root.resolve())
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  destination.write_bytes(z.read(prefix+f['path']))
          (root/archive).unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','-A'],check=True)
          subprocess.run(['git','commit','-m','fix: verify native runtime transformations and retain platform notices'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
