name: Diagnose macOS frozen runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e "backend[test]" "pyinstaller>=6.19,<7"
      - run: python scripts/freeze_engine.py --dest app/src-tauri/engine
      - name: Capture original and packaged runtime evidence
        shell: python
        run: |
          import ast, hashlib, json, pathlib, shutil, subprocess, sys
          root=pathlib.Path.cwd(); out=root/'runtime-diagnostic'; out.mkdir()
          toc=root/'build/freeze-engine/work/chem313-engine/COLLECT-00.toc'
          shutil.copy2(toc,out/'COLLECT-00.toc')
          entries=ast.literal_eval(toc.read_text()); entries=entries[0] if isinstance(entries,tuple) and len(entries)==1 else entries
          rows=[]; base=pathlib.Path(sys.base_prefix).resolve()
          for entry in entries:
              if not isinstance(entry,tuple) or len(entry)<3: continue
              destination,source,kind=entry[:3]
              if kind not in {'BINARY','EXTENSION'}: continue
              source=pathlib.Path(source)
              if not source.is_file() or not source.resolve().is_relative_to(base): continue
              if 'site-packages' in source.parts: continue
              packaged=root/'app/src-tauri/engine/_internal'/destination
              if not packaged.is_file(): continue
              index=str(len(rows)); shutil.copy2(source,out/(index+'.original')); shutil.copy2(packaged,out/(index+'.packaged'))
              row={'id':index,'destination':destination,'source':str(source),'kind':kind,'original_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),'packaged_sha256':hashlib.sha256(packaged.read_bytes()).hexdigest()}
              for label,file in [('original',source),('packaged',packaged)]:
                  for command in [('otool',['otool','-L',str(file)]),('codesign',['codesign','-d','--verbose=4',str(file)]),('version_strings',['sh','-c','strings "$1" | rg "ncurses [0-9]|OpenSSL [0-9]" | head -n 5','diagnostic',str(file)])]:
                      result=subprocess.run(command[1],capture_output=True,text=True); row[label+'_'+command[0]]=result.stdout+result.stderr
              rows.append(row)
          (out/'inventory.json').write_text(json.dumps({'python':sys.version,'base':str(base),'entries':rows},indent=2))
      - uses: actions/upload-artifact@v7
        with:
          name: macos-runtime-diagnostic
          path: runtime-diagnostic/
          if-no-files-found: error
