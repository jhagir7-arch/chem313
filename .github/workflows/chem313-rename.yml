name: Complete reviewed Chem313 branding
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chem313-reviewed-rename
  cancel-in-progress: false
jobs:
  rename:
    if: github.repository == 'jhagir7-arch/chem313' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify original file hashes and apply the reviewed naming patch
        shell: python
        run: |
          import base64, gzip, hashlib, json, pathlib, subprocess
          expected = {'NOTICE': '4d3aa35454df5ef6e462e479a021e812613725bce01c1e804f7b0b7482320c62', 'PROJECT_INDEX.md': '0a1e096686e2e42d7f2e14ebb459f70d7f139c17cad825eb05248ac9f66b2d6e', 'CONTRIBUTING.md': 'bddbd440bbf6458bd18e8d971f21f1c360c04bcc87641d85e4ec0429226850f4', 'docs/COMMUNITY.md': 'e9ead30fdd93b9f3b6a19fc0e509db1af2faef2dc816d6739833fd0ca6b34af8', 'frontend/package.json': '7c983d4311fd6cd6094f6e2d796e5e01341a0f86be02bb4befde8c8febb51ac1', 'frontend/package-lock.json': 'f8878f2ac43026575717d3ff3ac91f8410560957be81f7f464014e19ee9e0817', 'desktop/Info.plist': 'ad96a64470e5dc319d41c7d596a5266889bcdc24c7844162c32cfb86f382773e', 'scripts/build_standalone_app.sh': '13101fcc11c3992c90b9d8082b34ec5dc6468779b6c0d13e849032bc0cee2c84', 'scripts/build_public_app.sh': 'a6fad669bd0bde87cf2f1bdb15233c0422dd982ffee2e854086a7ea6f7141098', 'scripts/render_app_icon.swift': '2a82ed840999d4e85a24248901db188207f69e55a2da6f95f2bd6670bc0162d9', 'scripts/package_public_source.py': '2abb080e22d0dd1b4c68bf6547fc335f2bf5d37321e094b31c968f1051fb5ead', 'scripts/test_standalone_package.py': '4926f69ea952b94c757e215dfc4fad7b0930cb62fcc2345b8e913964451c7b9d', 'backend/tests/test_qwen_deployment.py': '4cf04468aef08932254e458acd1e04a75a457eec7ca08b98eeb647d6eaaa821b', 'release/standalone/README.txt': '1c301135f5c5276870ea898956cce634c7b3d69f8780b4af6dd7a69b46f5692d', 'release/public-source/README.md': '2e0e0a1d5c7404961bbc61c23f95f902e724e643a2e12a5d67e88bc3fb112385', 'release/public-source/SECURITY.md': '0c0c4e89b1f86159c103292dea1f5b0947d9d500b9b537f3a3f951fbca481d68', 'release/public-source/GITHUB_RELEASE_DRAFT.md': '411590eb9555afa2af983354b517da63e0892b5e380e445aec6452b1399db5de', 'release/public-source/NOTICE': '4d3aa35454df5ef6e462e479a021e812613725bce01c1e804f7b0b7482320c62', 'release/qwen/README.txt': '458cab2a9de0d4caca32bfc019bb45cb3db4e5151da305660cc388746114ccb1', 'release/qwen/BUILDING.md': 'e82fa94f832e921eeb4fd6a212e267e2f839d77ba432d3fd1ece3eff530443bc', 'release/qwen/RELEASE_NOTES.md': '2ef46f4e233b04bb00f9493d7a5485636a18a5feaec74a2328fcff2b68b09ebf', 'README.md': 'd574e086efc0bfa89d9b7ebf9bec3749de2787bcc032a59230d88a27685e8922', 'frontend/src/OrcaRun.tsx': '77ec3eb72b9e13bb5ac2236b99a6b23ecafec205ddd95bed66cc0a33138abe54', 'frontend/src/App.tsx': '41ef13b29feff47948b519af24eff1dbec5f42b94d5c98ff68cc250cfb78dc59', 'frontend/src/Guide.tsx': '4f240cc15f4be341d6147b0243fedd5f64a9d43ca84d0fc712bad202edbd2eb7', 'frontend/src/representationData.mjs': '05c10cb90bd88657be9b8a53ea68d55cc258565aaa0946dce3211ad5b79b1ec4', 'frontend/src/Recipes.tsx': '18fc76914b2cba96e42103f8ed91b5bd263818ba9e1429070eb84e617a9a4dd6', 'frontend/src/QchemCoach.tsx': 'f7b46674c57aefc2e30807c037dbabc28822db6e1c0e745e1bde20a541ff8aa8', 'frontend/src/StudyAgent.tsx': 'f611240b3c96c144a7056c65b9a6031ccbc256975483fbfb7661c139502c9822', 'frontend/src/RepresentationLesson.tsx': 'c41e46544fe4116d1eb3da5556e5cc78c49df76f7910b4f124403723fe62573c', 'frontend/src/studyReport.mjs': 'ec6686dc7ae9841fe6fbbb79e63cbca8d9e6f6d70cc32754a8a9cc5e1e8b2839', 'frontend/src/QchemRun.tsx': 'bb4e350034da003fc10b8a1bdd4627def0144400e8264b86c45861244bdb72dc', 'frontend/src/calculationReview.mjs': 'dad71b4f91a4e760191f49f7e8b14f0d3b1b47b7347fbccd860a538c2d916320', 'backend/src/hypothesislab/desktop.py': '344849699fddcc849e5efae2c282f49e9b880eb38fb5ed40b9bde379b756535b', 'backend/src/hypothesislab/assistant.py': '1e376be77adb6534e89ff096658d1007c6dd2928340b4db986367aa8da7d1a4e', 'backend/src/hypothesislab/avogadro_host.py': '3b75f9b0a19ab25e14b351da1880c634ca6964e87f72896ddebe9a8cffa7c09e', 'backend/src/hypothesislab/bioscience_contracts.py': '60f6e4c617def0c9b501f23028a394526972729311d4e5a7f89c5f185caa3fbe', 'backend/src/hypothesislab/science_contracts.py': '5b66432669fc9152c11db83c67a598a723de8f4f9633433542c39faa584e1f47', 'backend/src/hypothesislab/study_agent.py': '544811336744f7246536a4c91b50db58220a028efbc9e87a4d23707c2cc989d1', 'desktop/OpenChem.swift': 'f1739cd26340cbb2353086090eb06c4c76bdc90125c25b0735ed05c793d7406d', 'desktop/OpenChem.icns': 'd7afd641e4aef82dc57469afc3975a902a9385492e89e3cd0525ae319044347a', 'desktop/branding/OpenChem.png': '4ee0137cdfaaf7603d0c79ffead6b47cc2118f2f0131fe4ee074602a7c53a7ea', 'scripts/test_packaged_engine.py': '1f3b86be2e27ee4ae1ef266663e0ed4ac4fd9ca77593b6b4ba39c05ffd64c7a7', 'scripts/native_first_calculation_workflow.js': '226a9cfac2e67fc13b275e02e068066f131ea2f9b1561e500758ae2bd2a370ee'}
          renames = [('desktop/OpenChem.swift', 'desktop/Chem313.swift'), ('desktop/OpenChem.icns', 'desktop/Chem313.icns'), ('desktop/branding/OpenChem.png', 'desktop/branding/Chem313.png')]
          for name, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest, "Source changed since review: " + name
          for old, new in renames:
              assert not pathlib.Path(new).exists(), "Rename destination exists: " + new
              subprocess.run(["git", "mv", old, new], check=True)
          patch = gzip.decompress(base64.b64decode(""))
          assert hashlib.sha256(patch).hexdigest() == "f6ef6a04c1fe7c6f1d6631ccfedcebacc2622b4c8aa878ad87c525b884d58387"
          pathlib.Path("/tmp/chem313-rename.patch").write_bytes(patch)
          subprocess.run(["git", "apply", "--check", "/tmp/chem313-rename.patch"], check=True)
          subprocess.run(["git", "apply", "/tmp/chem313-rename.patch"], check=True)
          manifest_path = pathlib.Path("BUNDLE_MANIFEST.json")
          manifest = json.loads(manifest_path.read_text())
          renamed = dict(renames)
          for row in manifest["files"]:
              row["path"] = renamed.get(row["path"], row["path"])
              data = pathlib.Path(row["path"]).read_bytes()
              row.update(bytes=len(data), sha256=hashlib.sha256(data).hexdigest())
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          print("Verified and applied Chem313 naming update to", len(expected), "reviewed paths")

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check frontend behavior and project links
        run: |
          npm --prefix frontend test
          python3 scripts/check_project_index.py
          python3 -m compileall -q backend/src
      - name: Commit the reviewed branding changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'refactor: complete Chem313 app and repository branding'
          git push origin HEAD:main
